<!DOCTYPE html>
<html lang="es" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>JONATHAN RANGEL · Inversiones Guicar 2025 · Anime</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/theme.js"></script>
</head>
<body class="bg-black text-white selection:bg-green-500/30">

    <!-- ORBES DE FONDO -->
    <div class="bg-glow-orb w-[600px] h-[600px] bg-green-500/20 -top-40 -left-40"></div>
    <div class="bg-glow-orb w-[700px] h-[700px] bg-emerald-500/10 bottom-0 right-0"></div>

    <!-- HEADER -->
    <header class="fixed top-0 w-full z-50 bg-black/60 backdrop-blur-2xl border-b border-white/5">
        <div class="flex justify-between items-center px-6 md:px-12 h-20 max-w-7xl mx-auto">
            <div class="flex items-center gap-4">
                <img src="https://raw.githubusercontent.com/JJRB47/JJRB47/main/assets/logo-jrb.png"
                     alt="Logo Jonathan Rangel"
                     class="w-10 h-10 rounded-xl object-contain bg-white/5 p-1.5 border border-white/10"
                     onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                <div class="w-10 h-10 rounded-xl gradient-neon flex items-center justify-center text-xs font-bold text-black shadow-lg" style="display:none;">JR</div>
                <div class="flex flex-col">
                    <div class="text-sm font-medium tracking-[0.2em] text-white-neon uppercase leading-none mb-1">JONATHAN RANGEL</div>
                    <div class="text-[10px] text-neon-green font-medium tracking-wider uppercase">INVERSIONES GUICAR 2025 - ANIME</div>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="goToMainSite()" class="p-3 rounded-2xl glass hover:bg-white/10 transition-all duration-300 group">
                    <i data-lucide="home" class="w-5 h-5 text-white/80 group-hover:scale-110 transition-transform"></i>
                </button>
                <button onclick="openCart()" class="group relative p-3 rounded-2xl glass hover:bg-white/10 transition-all duration-300">
                    <i data-lucide="shopping-bag" class="w-5 h-5 text-white/80 group-hover:scale-110 transition-transform"></i>
                    <span id="cartBadge" class="hidden absolute -top-1.5 -right-1.5 w-5 h-5 badge-neon text-[10px] font-bold rounded-full flex items-center justify-center border-2 border-black">0</span>
                </button>
            </div>
        </div>
    </header>

    <main class="relative z-10 pt-32 pb-28 px-6 max-w-7xl mx-auto">
        <div id="categoriesView">
            <div id="categoryGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8"></div>
        </div>
        <div id="productsView" class="hidden">
            <button onclick="goBack()" class="flex items-center gap-2 glass px-5 py-2.5 rounded-2xl text-xs font-medium tracking-wide uppercase mb-10 hover:bg-white/10 transition-colors">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> Volver
            </button>
            <div id="productsContent"></div>
        </div>
    </main>

    <!-- CARRITO LATERAL -->
    <div id="cartOverlay" class="fixed inset-0 z-[60] bg-black/80 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-500" onclick="closeCart()"></div>
    <div id="cartPanel" class="fixed top-0 right-0 bottom-0 z-[70] w-full max-w-md cart-panel closed bg-zinc-950/95 backdrop-blur-3xl border-l border-white/10 flex flex-col shadow-2xl">
        <div class="flex justify-between items-center px-8 py-8">
            <div>
                <h2 class="text-2xl font-light tracking-tight text-white">Tu <span class="font-bold neon-green">Pedido</span></h2>
                <p class="text-xs mt-1 uppercase tracking-widest" id="cartCount"></p>
            </div>
            <button onclick="closeCart()" class="p-3 rounded-2xl bg-white/5 hover:bg-white/10 text-zinc-400 hover:text-white transition-all">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>
        <div class="flex-1 overflow-y-auto px-8 space-y-4" id="cartItems"></div>
        <div id="cartEmpty" class="flex-1 flex flex-col items-center justify-center text-center p-12">
            <div class="w-20 h-20 rounded-full bg-zinc-900 flex items-center justify-center mb-6">
                <i data-lucide="shopping-cart" class="w-8 h-8 text-zinc-700"></i>
            </div>
            <p class="text-zinc-500 font-medium">Tu carrito está vacío</p>
            <p class="text-zinc-600 text-xs mt-2">Agrega productos para cotizar</p>
        </div>
        <div id="cartFooter" class="hidden border-t border-white/5 p-8 bg-black/40">
            <div id="cartSummaryLines" class="flex flex-wrap gap-2 mb-8"></div>
            <div class="flex items-center justify-between mb-8">
                <span class="text-zinc-400 text-sm font-medium uppercase tracking-widest">TOTAL UNIDADES</span>
                <span class="text-3xl font-bold neon-green" id="cartTotalUnidades">0</span>
            </div>
            <div class="space-y-3">
                <button onclick="sendWhatsApp()" class="w-full btn-whatsapp py-4 rounded-2xl font-bold text-sm uppercase tracking-widest flex items-center justify-center gap-3">
                    <i data-lucide="message-circle" class="w-5 h-5"></i> Enviar por WhatsApp
                </button>
                <button onclick="openClearModal()" class="w-full py-3 rounded-xl text-[10px] uppercase tracking-[0.2em] text-zinc-500 hover:text-neon-green transition-colors font-semibold">
                    Vaciar Carrito
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL VACIAR CARRITO -->
    <div id="clearModal" class="fixed inset-0 z-[100] flex items-center justify-center opacity-0 pointer-events-none transition-all duration-300">
        <div class="absolute inset-0 bg-black/70 backdrop-blur-sm" onclick="closeClearModal()"></div>
        <div class="relative z-10 glass-card rounded-2xl p-6 max-w-sm w-full mx-4 transform scale-95 transition-all duration-300 border border-white/10 shadow-2xl" style="background: rgba(15,15,15,0.95);">
            <div class="flex flex-col items-center text-center">
                <div class="w-14 h-14 rounded-full bg-white/5 flex items-center justify-center mb-4 border border-white/10">
                    <i data-lucide="alert-triangle" class="w-7 h-7" style="color: var(--color-primary);"></i>
                </div>
                <h3 class="text-xl font-bold text-white mb-2">¿Vaciar todo el carrito?</h3>
                <p class="text-sm text-zinc-400 mb-6">Se eliminarán todos los productos seleccionados. Esta acción no se puede deshacer.</p>
                <div class="flex gap-3 w-full">
                    <button onclick="closeClearModal()" class="flex-1 py-2.5 rounded-xl border border-white/10 text-zinc-300 hover:bg-white/5 transition text-sm font-medium">Cancelar</button>
                    <button onclick="confirmClearCart()" class="flex-1 py-2.5 rounded-xl text-white font-bold transition-all active:scale-95" style="background: linear-gradient(135deg, var(--color-primary), var(--color-secondary)); box-shadow: 0 4px 15px var(--color-glow);">Sí, vaciar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
